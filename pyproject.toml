[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonarena"
version = "0.1.0"
description = "Community benchmark arena for Python JSON libraries — PR your library, CI rebuilds the leaderboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sophie Nguyen", email = "sophie.nguyenthuthuy@gmail.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Benchmark",
]

[project.scripts]
jsonarena = "jsonarena.cli:main"

[tool.setuptools.packages.find]
include = ["jsonarena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
